# Local multi-service stack for EduMatch.
#
#   docker compose up --build
#
# Services:
#   db            Postgres 17 on :5433 (matches `npm run db:local`)
#   frontend      Next.js on :3000
#   resume-parser FastAPI + Docling on :8000
#   backend       Express health API on :4000 (see DEPLOYMENT.md — reserved)
#
# Secrets come from the environment; export them before `up` (never commit
# them). See DEPLOYMENT.md for the full list.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: edumatch
      POSTGRES_PASSWORD: edumatch
      POSTGRES_DB: edumatch
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  resume-parser:
    build:
      context: ./resume-parser
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      PORT: "4000"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    environment:
      # Inside the compose network the database host is `db`, not localhost.
      DATABASE_URL: postgresql://edumatch:edumatch@db:5432/edumatch
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET}
      AUTH_TRUST_HOST: "true"
      RESUME_PARSER_URL: http://resume-parser:8000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      resume-parser:
        condition: service_started

volumes:
  db-data:
